name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Documentation-only changes do not need a build.
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash enables pipefail on every runner, including Windows: tee must not hide failures.
    shell: bash

env:
  QT_VERSION: '6.12.0'
  # Graphs requires Quick3D, whose runtime renderer requires ShaderTools.
  QT_MODULES: qtgraphs qtquick3d qtshadertools
  AQT_VERSION: '==3.3.0'
  # PyPI 3.3.0 predates the Windows repository split in Qt 6.11+; this upstream
  # commit handles qt6_6120/qt6_6120_msvc2022_64 without changing the Qt version.
  AQT_WINDOWS_VERSION: '@git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
  QT_QPA_PLATFORM: offscreen
  # Windows otherwise sends Qt warnings to the debugger instead of the CTest log.
  QT_FORCE_STDERR_LOGGING: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs check Windows and Linux; macOS runs on manual dispatch.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["macos-latest"]') }}
    env:
      CC: ${{ matrix.os == 'windows-latest' && 'cl' || matrix.os == 'macos-latest' && 'clang' || 'gcc-14' }}
      CXX: ${{ matrix.os == 'windows-latest' && 'cl' || matrix.os == 'macos-latest' && 'clang++' || 'g++-14' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare log directory
        run: mkdir -p build/ci-logs

      - name: Install GCC 14 and Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y g++-14 ninja-build libgl1-mesa-dev libvulkan-dev
            # qml_smoke: Qt Graphs creates an OpenGL QRhi on Linux whatever the scene graph backend
            # (ADR-006), so it runs on Xvfb with Mesa llvmpipe and the xcb platform plugin.
            # Mesa is only a recommendation of xvfb, hence listed explicitly.
            sudo apt-get install --no-install-recommends -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
              libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
              libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
            # QStandardPaths requires a private runtime directory even with offscreen rendering.
            install -d -m 700 "$RUNNER_TEMP/fdss-runtime"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/fdss-runtime" >> "$GITHUB_ENV"
          } 2>&1 | tee build/ci-logs/setup-linux.log

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
          modules: ${{ env.QT_MODULES }}
          aqtversion: ${{ runner.os == 'Windows' && env.AQT_WINDOWS_VERSION || env.AQT_VERSION }}
          cache: true
          cache-key-prefix: fdss-qt-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Verify build tools and Qt version
        run: |
          {
            cmake --version
            ninja --version
            # Native Windows tools may write CRLF even when invoked from bash.
            installed_qt_version=$(qtpaths --qt-version | tr -d '\r')
            echo "Qt $installed_qt_version"
            test "$installed_qt_version" = "$QT_VERSION"
            echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          } 2>&1 | tee build/ci-logs/toolchain.log

      - name: Configure
        run: cmake --preset dev 2>&1 | tee build/ci-logs/configure.log

      - name: Build
        id: build
        run: cmake --build --preset dev 2>&1 | tee build/ci-logs/build.log

      - name: Run tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # On Linux qml_smoke runs in the next step; CTest would force the offscreen platform.
        run: >-
          ctest --preset dev --output-on-failure --no-tests=error
          ${{ runner.os == 'Linux' && '-E qml_smoke' || '' }}
          2>&1 | tee build/ci-logs/ctest.log

      - name: Run qml_smoke (Linux, Xvfb + Mesa llvmpipe)
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 ./build/dev/tests/qml_smoke \
            2>&1 | tee build/ci-logs/qml-smoke-linux.log

      - name: Lint QML
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build --preset dev --target all_qmllint 2>&1 | tee build/ci-logs/qmllint.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}
          path: |
            build/ci-logs/
            build/dev/CMakeCache.txt
            build/dev/CMakeFiles/CMakeConfigureLog.yaml
            build/dev/Testing/Temporary/
            aqtinstall.log
          if-no-files-found: warn
          retention-days: 7

  format:
    if: github.event_name == 'pull_request'
    name: C++ formatting (clang-format 18.1.3)
    # Keep the formatter available independently of ubuntu-latest image upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format 18
        run: |
          mkdir -p build/ci-logs
          {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang-format-18
            # Refuse an unexpected formatter version instead of changing style silently.
            clang-format-18 --version | grep -F 'version 18.1.3 '
          } 2>&1 | tee build/ci-logs/setup-format.log

      - name: Check C++ formatting
        run: |
          git ls-files -z -- src tests \
            | grep -zE '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' \
            | xargs -0 -r clang-format-18 --dry-run --Werror \
            2>&1 | tee build/ci-logs/format.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-format
          path: build/ci-logs/
          if-no-files-found: warn
          retention-days: 7

  sanitizers:
    name: ASan and UBSan (Linux, Debug)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 14 and Linux prerequisites
        run: |
          mkdir -p build/ci-logs
          {
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y g++-14 ninja-build libgl1-mesa-dev libvulkan-dev
          } 2>&1 | tee build/ci-logs/setup-linux.log

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
          cache-key-prefix: fdss-qt-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Verify build tools and Qt version
        run: |
          {
            cmake --version
            ninja --version
            installed_qt_version=$(qtpaths --qt-version | tr -d '\r')
            echo "Qt $installed_qt_version"
            test "$installed_qt_version" = "$QT_VERSION"
            echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          } 2>&1 | tee build/ci-logs/toolchain.log

      - name: Configure with sanitizers
        run: |
          cmake --preset dev -B build/ci-sanitizers \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_MODULE_LINKER_FLAGS='-fsanitize=address,undefined' \
            2>&1 | tee build/ci-logs/configure-sanitizers.log

      - name: Build fdss_tests with sanitizers
        run: cmake --build build/ci-sanitizers --target fdss_tests 2>&1 | tee build/ci-logs/build-sanitizers.log

      - name: Run tests with sanitizers
        run: |
          ctest --test-dir build/ci-sanitizers --output-on-failure --no-tests=error -E qml_smoke \
            2>&1 | tee build/ci-logs/ctest-sanitizers.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-sanitizers
          path: |
            build/ci-logs/
            build/ci-sanitizers/CMakeCache.txt
            build/ci-sanitizers/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-sanitizers/Testing/Temporary/
            aqtinstall.log
          if-no-files-found: warn
          retention-days: 7
