<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Linux only. Puts DejaVu Sans, wider than the usual desktop fonts and close to the fallback of the
     CI runner, before every family, so qml_smoke finds labels that are cut there (P19b CI).
     Usage (fontconfig reads a relative path from /etc/fonts, so it must be absolute):
     FONTCONFIG_FILE=$PWD/tests/fonts/wide-fonts.conf QT_QPA_PLATFORM=offscreen ./build/dev/tests/qml_smoke -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
